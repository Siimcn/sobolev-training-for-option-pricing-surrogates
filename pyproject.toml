[project]
name = "sobolev-training-for-option-pricing-surrogates"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "equinox>=0.13.8",
    "jax>=0.11.0",
    "matplotlib>=3.11.1",
    "optax>=0.2.8",
    "optimistix>=0.1.0",
    "yfinance>=1.5.1",
]

[tool.setuptools.packages.find]
include = [
    "calibration*",
    "market_simulation*",
    "pipeline*",
    "risk_visualization*",
    "surrogate_modeling*",
    "utils*",
]


[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "black>=25.0",
    "pytest>=9.1.1",
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-print-site-plugin>=2.8",
]

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "diff-ml-main"

skip-magic-trailing-comma = true
