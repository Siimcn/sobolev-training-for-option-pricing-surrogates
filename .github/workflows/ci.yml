name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install black pytest

      - name: Formatting
        run: python -m black --check --diff .

      # Fast and the most informative single check: it hashes the sampled
      # domain, the Monte Carlo labels, their derivatives and the trained
      # weights for all six pricing problems. A changed hash means the
      # numbers moved, which no other test in the suite would catch.
      - name: Reproducibility
        run: python -m pytest tests/test_reproducibility.py -q

      - name: Tests
        run: python -m pytest tests/ -q
